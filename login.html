<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGRI MITRA | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">🌾 AGRI MITRA</div>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="signup.html">Sign Up</a>
            <a href="dashboard.html">Dashboard</a>
        </nav>
    </header>

    <main class="page-shell">
        <section class="auth-card">
            <div class="auth-header">
                <h2>Farmer Login</h2>
                <p>Access the AGRI MITRA dashboard.</p>
            </div>

            <form class="auth-form active-form" id="loginForm">
                <label for="loginEmail">Email</label>
                <input id="loginEmail" name="email" type="email" placeholder="farmer@email.com" required>
                <label for="loginPassword">Password</label>
                <input id="loginPassword" name="password" type="password" placeholder="Enter password" required>
                <button type="submit" class="btn-primary full-width">Login</button>
                <div class="message" id="loginMessage"></div>
            </form>

            <div class="page-links">
                <a href="signup.html">Create new account</a>
                <a href="dashboard.html">Open prediction dashboard</a>
            </div>
        </section>
    </main>

    <script src="login.js"></script>
</body>
</html>
