<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGRI MITRA | Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">🌾 AGRI MITRA</div>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="signup.html">Sign Up</a>
            <a href="dashboard.html">Dashboard</a>
        </nav>
    </header>

    <main>
        <section class="dashboard" id="dashboard">
            <div class="form-card full-width-card">
                <h2>Prediction Command Console</h2>
                <form id="cropForm">
                    <div class="grid">
                        <div class="field-block">
                            <label for="temperature">Temperature (°C)</label>
                            <input type="number" id="temperature" name="temperature" value="25" placeholder="Enter temperature in °C" required>
                        </div>
                        <div class="field-block">
                            <label for="humidity">Humidity (%)</label>
                            <input type="number" id="humidity" name="humidity" value="50" placeholder="Enter humidity %" required>
                        </div>
                        <div class="field-block">
                            <label for="ph">Soil pH</label>
                            <input type="number" id="ph" name="ph" value="6.5" step="0.1" placeholder="Enter soil pH" required>
                        </div>
                        <div class="field-block">
                            <label for="rainfall">Rainfall (mm)</label>
                            <input type="number" id="rainfall" name="rainfall" value="150" placeholder="Enter rainfall in mm" required>
                        </div>
                        <div class="field-block">
                            <label for="nitrogen">Nitrogen (N)</label>
                            <input type="number" id="nitrogen" name="nitrogen" value="80" placeholder="Enter nitrogen value" required>
                        </div>
                        <div class="field-block">
                            <label for="phosphorus">Phosphorus (P)</label>
                            <input type="number" id="phosphorus" name="phosphorus" value="60" placeholder="Enter phosphorus value" required>
                        </div>
                        <div class="field-block">
                            <label for="potassium">Potassium (K)</label>
                            <input type="number" id="potassium" name="potassium" value="70" placeholder="Enter potassium value" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary full-width">Predict Crop</button>
                    <div class="message" id="cropMessage"></div>
                </form>
            </div>

            <section class="result-card" id="predictionResult">
                <div class="status-strip">
                    <span class="status-dot">Field intelligence online</span>
                    <span id="predictionTime">--</span>
                </div>
                <div class="result-body">
                    <div class="crop-result" id="resultCrop">--</div>
                    <div id="resultSummary" class="summary">No prediction generated yet.</div>
                    <div class="confidence" id="resultConfidence">Confidence: --</div>
                    <div class="summary" id="resultFertilizer">Fertilizer: --</div>
                </div>
            </section>
        </section>
    </main>

    <script src="dashboard.js"></script>
</body>
</html>
