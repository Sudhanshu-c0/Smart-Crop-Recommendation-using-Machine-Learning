<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AGRI MITRA | Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            font-family: "DM Sans", sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    rgba(4, 35, 16, 0.88),
                    rgba(20, 91, 42, 0.55),
                    rgba(3, 40, 19, 0.85)
                ),
                url("https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=2200&q=90");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            overflow-x: hidden;
        }


        /* ================= NAVBAR ================= */

        .navbar {
            position: fixed;

            top: 20px;
            left: 5%;
            right: 5%;

            height: 68px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 24px;

            border: 1px solid rgba(255,255,255,0.20);
            border-radius: 20px;

            background: rgba(255,255,255,0.10);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow: 0 10px 40px rgba(0,0,0,0.20);

            z-index: 10;
        }


        .logo {
            display: flex;
            align-items: center;
            gap: 10px;

            font-family: "Poppins", sans-serif;

            font-size: 20px;
            font-weight: 800;

            letter-spacing: 1px;
        }


        .logo-icon {
            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;

            background: rgba(198,245,140,0.20);

            border: 1px solid rgba(198,245,140,0.25);

            font-size: 21px;
        }


        .nav {
            display: flex;
            gap: 5px;
        }


        .nav a {
            color: white;

            text-decoration: none;

            padding: 9px 15px;

            border-radius: 11px;

            font-size: 14px;
            font-weight: 600;

            transition: 0.3s;
        }


        .nav a:hover {
            background: rgba(255,255,255,0.13);

            transform: translateY(-2px);
        }


        .nav .active {
            color: #173a20;

            background: #c6f58c;
        }


        /* ================= LOGIN CONTAINER ================= */

        .login-wrapper {
            width: 100%;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 120px 20px 50px;
        }


        /* ================= GLASS LOGIN CARD ================= */

        .login-card {

            width: 430px;

            padding: 42px;

            border-radius: 30px;

            border: 1px solid rgba(255,255,255,0.25);

            background: rgba(255,255,255,0.12);

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            box-shadow:
                0 30px 80px rgba(0,0,0,0.35);

            animation: cardAppear 0.7s ease;
        }


        @keyframes cardAppear {

            from {
                opacity: 0;
                transform: translateY(25px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        }


        /* ================= HEADER ================= */

        .login-header {
            text-align: center;

            margin-bottom: 32px;
        }


        .login-icon {

            width: 65px;
            height: 65px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto 18px;

            border-radius: 20px;

            background: rgba(198,245,140,0.16);

            border: 1px solid rgba(198,245,140,0.25);

            font-size: 32px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.15);
        }


        .login-header h1 {

            font-family: "Poppins", sans-serif;

            font-size: 30px;

            margin-bottom: 8px;
        }


        .login-header h1 span {

            color: #c6f58c;
        }


        .login-header p {

            color: rgba(255,255,255,0.65);

            font-size: 14px;
        }


        /* ================= FORM ================= */

        .form-group {
            margin-bottom: 20px;
        }


        .form-group label {

            display: block;

            margin-bottom: 8px;

            font-size: 13px;

            font-weight: 600;

            color: rgba(255,255,255,0.85);
        }


        .input-wrapper {
            position: relative;
        }


        .input-icon {

            position: absolute;

            left: 15px;
            top: 50%;

            transform: translateY(-50%);

            font-size: 17px;

            opacity: 0.65;

            pointer-events: none;
        }


        input {

            width: 100%;

            height: 52px;

            padding: 0 45px;

            border-radius: 14px;

            border: 1px solid rgba(255,255,255,0.18);

            outline: none;

            background: rgba(0,0,0,0.14);

            color: white;

            font-family: inherit;

            font-size: 14px;

            transition: 0.3s;
        }


        input::placeholder {

            color: rgba(255,255,255,0.42);
        }


        input:focus {

            border-color: #c6f58c;

            background: rgba(0,0,0,0.20);

            box-shadow:
                0 0 0 3px rgba(198,245,140,0.10);
        }


        .password-toggle {

            position: absolute;

            right: 14px;
            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: none;

            color: rgba(255,255,255,0.65);

            cursor: pointer;

            font-size: 16px;
        }


        /* ================= OPTIONS ================= */

        .form-options {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin: 5px 0 24px;

            font-size: 12px;
        }


        .remember {

            display: flex;

            align-items: center;

            gap: 7px;

            color: rgba(255,255,255,0.65);
        }


        .remember input {

            width: 14px;
            height: 14px;

            accent-color: #c6f58c;
        }


        .forgot {

            color: #c6f58c;

            text-decoration: none;

            font-weight: 600;
        }


        .forgot:hover {
            text-decoration: underline;
        }


        /* ================= LOGIN BUTTON ================= */

        .login-btn {

            width: 100%;

            height: 53px;

            border: none;

            border-radius: 14px;

            background: #c6f58c;

            color: #173a20;

            font-family: "Poppins", sans-serif;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.3s;

            box-shadow:
                0 10px 30px rgba(198,245,140,0.18);
        }


        .login-btn:hover {

            transform: translateY(-3px);

            background: #d4f9a5;

            box-shadow:
                0 15px 35px rgba(198,245,140,0.28);
        }


        .login-btn:active {
            transform: translateY(0);
        }


        /* ================= MESSAGE ================= */

        .message {

            min-height: 22px;

            margin-top: 14px;

            text-align: center;

            font-size: 13px;
        }


        /* ================= SIGNUP ================= */

        .signup {

            margin-top: 27px;

            padding-top: 23px;

            border-top: 1px solid rgba(255,255,255,0.12);

            text-align: center;

            color: rgba(255,255,255,0.60);

            font-size: 13px;
        }


        .signup a {

            color: #c6f58c;

            text-decoration: none;

            font-weight: 700;

            margin-left: 5px;
        }


        .signup a:hover {
            text-decoration: underline;
        }


        /* ================= DASHBOARD LINK ================= */

        .dashboard-link {

            display: block;

            text-align: center;

            margin-top: 18px;

            color: rgba(255,255,255,0.60);

            text-decoration: none;

            font-size: 12px;

            transition: 0.3s;
        }


        .dashboard-link:hover {
            color: white;
        }


        /* ================= RESPONSIVE ================= */

        @media(max-width: 700px) {

            .navbar {
                left: 3%;
                right: 3%;

                padding: 0 13px;
            }

            .logo {
                font-size: 16px;
            }

            .logo-icon {
                width: 32px;
                height: 32px;

                font-size: 18px;
            }

            .nav a {
                padding: 7px 8px;

                font-size: 10px;
            }

            .login-wrapper {
                padding: 115px 18px 40px;
            }

            .login-card {
                padding: 32px 24px;

                border-radius: 25px;
            }

        }


        @media(max-width: 430px) {

            .nav a:not(.active) {
                display: none;
            }

            .login-card {
                width: 100%;
            }

        }

    </style>
</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="logo">

            <div class="logo-icon">
                🌱
            </div>

            AGRI MITRA

        </div>


        <nav class="nav">

            <a href="index.html">
                Home
            </a>

            <a href="login.html" class="active">
                Login
            </a>

            <a href="signup.html">
                Sign Up
            </a>

        </nav>

    </header>



    <!-- ================= LOGIN ================= -->

    <main class="login-wrapper">

        <section class="login-card">


            <div class="login-header">

                <div class="login-icon">
                    🌾
                </div>

                <h1>
                    Welcome to <span>AGRI MITRA</span>
                </h1>

                <p>
                    Your intelligent farming companion
                </p>

            </div>



            <form id="loginForm">


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="loginEmail">
                        Email Address
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            ✉
                        </span>

                        <input
                            id="loginEmail"
                            name="email"
                            type="email"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            🔒
                        </span>

                        <input
                            id="loginPassword"
                            name="password"
                            type="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword()"
                            aria-label="Show password"
                        >
                            👁
                        </button>

                    </div>

                </div>



                <!-- OPTIONS -->

                <div class="form-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="remember"
                        >

                        Remember me

                    </label>


                    <a href="#" class="forgot">
                        Forgot password?
                    </a>

                </div>



                <!-- LOGIN -->

                <button
                    type="submit"
                    class="login-btn"
                >
                    Login to AGRI MITRA →
                </button>


                <div
                    class="message"
                    id="loginMessage"
                ></div>

            </form>



            <!-- SIGN UP -->

            <div class="signup">

                Don't have an account?

                <a href="signup.html">
                    Create Account
                </a>

            </div>


        </section>

    </main>



    <!-- ================= PASSWORD SCRIPT ================= -->

    <script>

        function togglePassword() {

            const password =
                document.getElementById("loginPassword");

            const button =
                document.querySelector(".password-toggle");


            if (password.type === "password") {

                password.type = "text";

                button.textContent = "🙈";

            } else {

                password.type = "password";

                button.textContent = "👁";

            }

        }

    </script>


    <!-- YOUR EXISTING LOGIN JAVASCRIPT -->

    <script src="login.js"></script>

</body>
</html>
```
